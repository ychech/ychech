<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="0.5" stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>
    <filter id="wglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 底层波浪（慢） -->
  <g opacity="0.4" filter="url(#wglow)">
    <path d="M0,50 C112,90 225,10 337,50 C450,90 562,10 675,50 C787,90 900,10 1012,50 C1125,90 1237,10 1350,50 L1350,90 L0,90 Z" fill="url(#wave)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-675 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 顶层波浪（快） -->
  <path d="M0,60 C112,20 225,100 337,60 C450,20 562,100 675,60 C787,20 900,100 1012,60 C1125,20 1237,100 1350,60 L1350,90 L0,90 Z" fill="url(#wave)" filter="url(#wglow)">
    <animateTransform attributeName="transform" type="translate" from="-675 0" to="0 0" dur="9s" repeatCount="indefinite"/>
  </path>
</svg>
