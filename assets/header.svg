<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" fill="#ffffff"/>

  <!-- 四角柔光晕 -->
  <circle cx="60" cy="60" r="90" fill="#c7f0ee" opacity="0.55" filter="url(#soft)"/>
  <circle cx="870" cy="260" r="100" fill="#ddd6fe" opacity="0.55" filter="url(#soft)">
    <animate attributeName="opacity" values="0.55;0.75;0.55" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="40" r="70" fill="#bae6fd" opacity="0.4" filter="url(#soft)"/>
  <circle cx="120" cy="260" r="80" fill="#e0e7ff" opacity="0.45" filter="url(#soft)"/>

  <!-- 连线（画在节点下面） -->
  <g stroke-width="1" fill="none">
    <g stroke="#22d3ee" opacity="0.35">
      <line x1="80" y1="120" x2="260" y2="90"/><line x1="260" y1="90" x2="340" y2="180"/>
      <line x1="340" y1="180" x2="180" y2="220"/><line x1="180" y1="220" x2="300" y2="260"/>
      <line x1="340" y1="180" x2="560" y2="240"/><line x1="260" y1="90" x2="480" y2="60"/>
      <line x1="480" y1="60" x2="520" y2="150"/><line x1="520" y1="150" x2="650" y2="100"/>
      <line x1="650" y1="100" x2="720" y2="50"/>
    </g>
    <g stroke="#8b5cf6" opacity="0.35">
      <line x1="520" y1="150" x2="620" y2="190"/><line x1="620" y1="190" x2="560" y2="240"/>
      <line x1="620" y1="190" x2="740" y2="250"/><line x1="620" y1="190" x2="700" y2="160"/>
      <line x1="740" y1="250" x2="840" y2="220"/><line x1="740" y1="250" x2="790" y2="180"/>
    </g>
    <g stroke="url(#line)" opacity="0.4">
      <line x1="720" y1="50" x2="760" y2="120"/><line x1="760" y1="120" x2="830" y2="70"/>
      <line x1="830" y1="70" x2="870" y2="140"/><line x1="870" y1="140" x2="790" y2="180"/>
      <line x1="790" y1="180" x2="840" y2="220"/><line x1="700" y1="160" x2="760" y2="120"/>
      <line x1="700" y1="160" x2="790" y2="180"/><line x1="760" y1="120" x2="810" y2="110"/>
      <line x1="810" y1="110" x2="830" y2="70"/><line x1="810" y1="110" x2="790" y2="180"/>
      <line x1="870" y1="140" x2="840" y2="220"/><line x1="720" y1="50" x2="880" y2="40"/>
      <line x1="880" y1="40" x2="830" y2="70"/><line x1="700" y1="160" x2="650" y2="100"/>
    </g>
    <!-- 几条呼吸闪烁的线 -->
    <line x1="830" y1="70" x2="870" y2="140" stroke="#14b8a6" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="760" y1="120" x2="790" y2="180" stroke="#8b5cf6" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.65;0.2" dur="4.2s" repeatCount="indefinite"/>
    </line>
    <line x1="520" y1="150" x2="650" y2="100" stroke="#22d3ee" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 节点 -->
  <g filter="url(#glow)">
    <g fill="#22d3ee">
      <circle cx="80" cy="120" r="3.5"/><circle cx="480" cy="60" r="4"/>
      <circle cx="650" cy="100" r="4"/><circle cx="720" cy="50" r="4"/>
      <circle cx="830" cy="70" r="4.5"/><circle cx="880" cy="40" r="3"/>
    </g>
    <g fill="#14b8a6">
      <circle cx="260" cy="90" r="4"/><circle cx="520" cy="150" r="5">
        <animate attributeName="r" values="5;7;5" dur="4s" repeatCount="indefinite"/>
      </circle><circle cx="700" cy="160" r="4"/><circle cx="810" cy="110" r="3.5"/>
    </g>
    <g fill="#8b5cf6">
      <circle cx="340" cy="180" r="4"/><circle cx="180" cy="220" r="3.5"/>
      <circle cx="300" cy="260" r="3"/><circle cx="620" cy="190" r="4.5"/>
      <circle cx="560" cy="240" r="4"/><circle cx="760" cy="120" r="4.5"/>
      <circle cx="870" cy="140" r="4"/><circle cx="790" cy="180" r="5">
        <animate attributeName="r" values="5;6.5;5" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#6366f1">
      <circle cx="740" cy="250" r="4.5"/><circle cx="840" cy="220" r="4"/>
      <circle cx="830" cy="70" r="3"/>
    </g>
  </g>

  <!-- 主标题（白描边保证在网格上可读） -->
  <text x="450" y="152" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="74" font-weight="800" fill="url(#ink)" letter-spacing="10" paint-order="stroke" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" filter="url(#glow)">YCHECH</text>

  <!-- 分割线 -->
  <line x1="280" y1="196" x2="620" y2="196" stroke="url(#line)" stroke-width="2" opacity="0.7">
    <animate attributeName="x1" values="280;330;280" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="620;570;620" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- 副标题 -->
  <text x="450" y="236" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#475569" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">逸 尘 · Code / AI / Fun</text>
</svg>
