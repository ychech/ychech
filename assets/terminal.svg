<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210">
  <defs>
    <filter id="twin-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 终端窗口（电影绿调） -->
  <rect x="1" y="1" width="718" height="208" rx="14" fill="#0b1917" stroke="#1f4a43" stroke-width="1.5"/>
  <rect x="1" y="1" width="718" height="36" rx="14" fill="#0e2119"/>
  <rect x="1" y="22" width="718" height="15" fill="#0e2119"/>

  <circle cx="28" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="19" r="6" fill="#27c93f"/>
  <text x="360" y="24" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#2f6b5e">ychech@github: ~</text>

  <!-- $ whoami -->
  <text x="30" y="70" font-family="Consolas, monospace" font-size="15" fill="#4bf2de" filter="url(#twin-glow)">&gt; whoami
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.15;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="130" y="70" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#d7f5e7">逸尘 (ychech)
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.28;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- $ cat today.txt -->
  <text x="30" y="105" font-family="Consolas, monospace" font-size="15" fill="#4bf2de" filter="url(#twin-glow)">&gt; cat today.txt
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.42;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="130" y="105" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8fe6c4">白天攻防 · 晚上烧 token
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.55;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- $ ./coffee.sh -->
  <text x="30" y="140" font-family="Consolas, monospace" font-size="15" fill="#4bf2de" filter="url(#twin-glow)">&gt; ./coffee.sh
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.68;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <g filter="url(#twin-glow)">
    <text x="130" y="140" font-family="Consolas, monospace" font-size="15" fill="#8793e9" opacity="0">brewing
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.70;0.78;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="205" y="140" font-family="Consolas, monospace" font-size="15" fill="#8793e9" opacity="0">.
      <animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.78;0.83;0.86;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="205" y="140" font-family="Consolas, monospace" font-size="15" fill="#8793e9" opacity="0">. .
      <animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.86;0.90;0.93;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="205" y="140" font-family="Consolas, monospace" font-size="15" fill="#8793e9" opacity="0">. . .
      <animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.93;0.96;0.98;0.995;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- 光标 -->
  <rect x="30" y="160" width="10" height="18" fill="#4bf2de" filter="url(#twin-glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="52" y="174" font-family="Consolas, monospace" font-size="14" fill="#2f6b5e" opacity="0">ships daily 🚀
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.94;1" dur="8s" repeatCount="indefinite"/>
  </text>
</svg>
